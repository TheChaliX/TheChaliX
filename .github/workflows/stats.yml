name: Actualizar estadísticas

on:
  schedule:
    - cron: "17 9 * * *"   # todos los días, 06:17 hora Argentina
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
  push:
    paths:
      - "scripts/stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar stats.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/stats.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || (git commit -m "Actualizar estadísticas" && git push)
