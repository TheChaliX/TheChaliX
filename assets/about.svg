<text x="72" y="46" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="2">SOBRE MÍ</text>
<text x="160.56" y="46" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6E6E6A" text-anchor="start" letter-spacing="1">/ About me</text>
<line x1="40" y1="62" x2="860" y2="62" stroke="#E4E4DE"/>
<text x="40" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0">Estudio Análisis de Sistemas en un Instituto de Educación Superior de Santa Fe.</text>
<text x="40" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0">Me gusta que lo que programo se use: además de los trabajos de la carrera,</text>
<text x="40" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0">armo sistemas para comercios reales y los ajusto con el feedback de quien los usa.</text>
<text x="40" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6E6E6A" text-anchor="start" letter-spacing="0">Systems analysis student. I like my code to be used: I build systems for real shops</text>
<text x="40" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6E6E6A" text-anchor="start" letter-spacing="0">and improve them with feedback from the people who use them every day.</text>

